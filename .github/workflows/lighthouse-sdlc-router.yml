# Optional GitHub-native stage adapter; source owned by lighthouse-sdlc.
name: Lighthouse SDLC router
run-name: "${{ inputs.stage || github.event.label.name || 'refine' }} #${{ github.event.issue.number || inputs.issue }} · ${{ github.actor }}"
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Open issue to process
        required: true
        type: string
      stage:
        description: Authorized lifecycle stage
        required: true
        default: refine
        type: choice
        options: [refine, propose]
permissions:
  contents: read
concurrency:
  group: lighthouse-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  route:
    if: >-
      vars.LIGHTHOUSE_AUTOMATION_ENABLED == 'true' &&
      github.actor == github.repository_owner &&
      !github.event.issue.pull_request &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && (github.event.label.name == 'refine' || github.event.label.name == 'propose')) ||
       (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'needs-info')))
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.route.outputs.run }}
      issue: ${{ steps.route.outputs.issue }}
      stage: ${{ steps.route.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: juangcarmona/lighthouse
          ref: __LIGHTHOUSE_REF__
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Route the authorized event
        id: route
        run: node src/packages/sdlc/src/issue-actions.mjs route
  refine:
    needs: route
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'refine'
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/lighthouse-sdlc-refine.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
  propose:
    needs: route
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'propose'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/lighthouse-sdlc-propose.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
