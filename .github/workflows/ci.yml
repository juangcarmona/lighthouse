name: Lighthouse verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chrome for architecture rendering
        run: npx --no-install puppeteer browsers install chrome
      - run: npm run verify
  dotnet:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: src/dotnet/global.json
      - run: npm run verify:dotnet
      - run: npm run verify:adoption
  visual:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14
