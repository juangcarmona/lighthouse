name: Lighthouse verification

on:
  workflow_dispatch:
    inputs:
      check_ci_app:
        description: Validate the configured CI App without creating a verification ref
        type: boolean
        default: false
  push:
    branches: [main, 'lighthouse/verification-*']
  pull_request:

permissions:
  contents: read

jobs:
  ci-app:
    if: github.event_name == 'workflow_dispatch' && inputs.check_ci_app == true && github.actor == github.repository_owner && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check the repository-scoped App installation
        env:
          LIGHTHOUSE_CI_APP_CLIENT_ID: ${{ vars.LIGHTHOUSE_CI_APP_CLIENT_ID }}
          LIGHTHOUSE_CI_APP_PRIVATE_KEY: ${{ secrets.LIGHTHOUSE_CI_APP_PRIVATE_KEY }}
        run: node src/packages/sdlc/src/github-app-ci.mjs check
  repository:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chrome for architecture rendering
        run: npx --no-install puppeteer browsers install chrome
      - run: npm run verify
  continue-post-merge-review:
    timeout-minutes: 5
    needs: repository
    if: always() && needs.repository.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6950ab12b73a921cebc90928bf4f60a8d6a7b6d0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Signal post-merge review through the existing router
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_CI_RESULT: ${{ needs.repository.result }}
        run: node src/packages/sdlc/src/issue-actions.mjs signal-post-merge-review
  reconcile-implementation-pr:
    timeout-minutes: 5
    needs: repository
    if: always() && ((github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/lighthouse/implement-')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lighthouse/verification-')))
    concurrency:
      group: lighthouse-pr-state
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6950ab12b73a921cebc90928bf4f60a8d6a7b6d0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Project the verified implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_CI_RECONCILE: 'true'
        run: node src/packages/sdlc/src/pr-state-actions.mjs
      - name: Signal failed candidate CI
        if: always() && needs.repository.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_CI_RESULT: ${{ needs.repository.result }}
        run: node src/packages/sdlc/src/issue-actions.mjs signal-ci-failure
