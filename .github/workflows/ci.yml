name: Lighthouse verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chrome for architecture rendering
        run: npx --no-install puppeteer browsers install chrome
      - run: npm run verify
  reconcile-implementation-pr:
    timeout-minutes: 5
    needs: repository
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/lighthouse/implement-')
    concurrency:
      group: lighthouse-pr-state
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cb78dca5a70584565d21f7ab1526b9e3290853bf
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Project the verified implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_CI_RECONCILE: 'true'
        run: node src/packages/sdlc/src/pr-state-actions.mjs
      - name: Signal failed candidate CI
        if: always() && needs.repository.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_CI_RESULT: ${{ needs.repository.result }}
        run: node src/packages/sdlc/src/issue-actions.mjs signal-ci-failure
