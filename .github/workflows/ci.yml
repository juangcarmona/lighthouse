name: Lighthouse verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "src/dotnet/**"
      - "src/gallery/**"
      - "src/packages/**"
      - "src/tests/**"
  pull_request:
    paths-ignore:
      - "src/dotnet/**"
      - "src/gallery/**"
      - "src/packages/**"
      - "src/tests/**"

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chrome for architecture rendering
        run: npx --no-install puppeteer browsers install chrome
      - run: npm run verify
