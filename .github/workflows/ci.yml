name: Lighthouse verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chrome for architecture rendering
        run: npx --no-install puppeteer browsers install chrome
      - run: npm run verify
  reconcile-implementation-pr:
    needs: repository
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/lighthouse/implement-')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: e83b948710f5396af9f92067f40e5e87fd90dcb3
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Project the verified implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_CI_RECONCILE: 'true'
        run: node src/packages/sdlc/src/pr-state-actions.mjs
