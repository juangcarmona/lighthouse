name: Controlled command evidence 100
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
jobs:
  command-evidence:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, linux, lighthouse-workflow]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: docker pull node:24-bookworm-slim
      - name: Execute the actual host checker and candidate publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/acceptance-100-command.mjs
      - name: Retain the original command evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-command-evidence-372-${{ github.run_attempt }}
          path: ${{ runner.temp }}/command-evidence-100/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain full host command outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: implementation-evidence-372-${{ github.run_attempt }}
          path: ${{ runner.temp }}/command-evidence-100/evidence/
          if-no-files-found: error
          retention-days: 30
