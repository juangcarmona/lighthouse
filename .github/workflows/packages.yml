name: Lighthouse package contracts

on:
  pull_request:
    paths:
      - "src/packages/**"
      - "src/tests/**"
      - "scripts/verify-package-consumer.mjs"
      - "scripts/verify-issue-workflows.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/packages.yml"
  push:
    branches: [main]
    paths:
      - "src/packages/**"
      - "src/tests/**"
      - "scripts/verify-package-consumer.mjs"
      - "scripts/verify-issue-workflows.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/packages.yml"
  workflow_dispatch:
    inputs:
      consumer_repository:
        description: "Adopter repository to exercise with the packaged CLI"
        required: true
      consumer_ref:
        description: "Adopter ref"
        required: true
        default: "main"
      worker_runtime_acceptance:
        description: "Exercise the operator's pinned worker image and evidence boundary"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lighthouse-packages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Check package contents
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate installed issue workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-issue-workflows.sh

  clean-consumer:
    name: Exercise a clean consumer
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Create empty consumer fixture
        run: |
          mkdir -p .tmp/consumer
          cat > .tmp/consumer/package.json <<'EOF'
          {
            "name": "lighthouse-clean-consumer",
            "private": true,
            "version": "0.0.0"
          }
          EOF
      - run: npm run verify:package-consumer
        env:
          LIGHTHOUSE_CONSUMER_ROOT: .tmp/consumer
          LIGHTHOUSE_AUTHORITIES_APPLY: "true"

  worker-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.worker_runtime_acceptance && github.actor == github.repository_owner
    name: Exercise worker runtime boundaries
    runs-on: [self-hosted, linux, lighthouse-workflow]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Select the operator's pinned implementation image
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const config = JSON.parse(readFileSync(process.env.LIGHTHOUSE_ENGINE_CONFIG, 'utf8'));
          if (!/^sha256:[a-f0-9]{64}$/.test(config.implementationImage)) throw Error('Provision and pin the implementation image before runtime acceptance');
          appendFileSync(process.env.GITHUB_ENV, `LIGHTHOUSE_TEST_IMAGE=${config.implementationImage}\n`);
          const directory = join(process.env.RUNNER_TEMP, 'worker-runtime-acceptance');
          mkdirSync(directory, { recursive: true });
          writeFileSync(join(directory, 'receipt.json'), JSON.stringify({ sourceRevision: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, implementationImage: config.implementationImage, node: process.version, package: JSON.parse(readFileSync('src/packages/sdlc/package.json', 'utf8')).version, worker: 'deterministic; no model invoked' }, null, 2));
          JS
      - name: Exercise different UIDs, prerequisites and failed evidence collection
        run: |
          mkdir -p "$RUNNER_TEMP/worker-runtime-acceptance"
          if ! node --test src/tests/worker-evidence.integration.test.mjs src/tests/implementation-runtime.test.mjs src/tests/execution-environment.test.mjs src/tests/verification-publication.test.mjs src/tests/pr-state.test.mjs > "$RUNNER_TEMP/worker-runtime-acceptance/results.log" 2>&1; then
            cat "$RUNNER_TEMP/worker-runtime-acceptance/results.log"
            exit 1
          fi
      - name: Retain acceptance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-runtime-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-runtime-acceptance/
          if-no-files-found: error
          retention-days: 30

  adopter:
    if: github.event_name == 'workflow_dispatch' && !inputs.worker_runtime_acceptance
    name: Install CLI in adopter checkout
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.consumer_repository }}
          ref: ${{ inputs.consumer_ref }}
          path: .tmp/consumer
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify:package-consumer
        env:
          LIGHTHOUSE_CONSUMER_ROOT: .tmp/consumer
