# Optional serial child delivery; owner decisions remain explicit for each merge.
name: Lighthouse epic reconciliation
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Parent issue with an authenticated decomposition plan
        required: true
        type: string
      action:
        description: Reconcile children, register or review a child PR, or publish the aggregate
        required: true
        default: reconcile
        type: choice
        options: [reconcile, refine-child, register-pr, ready-child, accept-child, publish-aggregate, ready-aggregate, accept-aggregate]
      child:
        description: Child issue number for PR registration or acceptance
        required: false
        type: string
      run:
        description: Child implementation run ID for PR registration
        required: false
        type: string
      pull-request:
        description: Child PR number for acceptance
        required: false
        type: string
      review:
        description: Owner approval review ID for acceptance
        required: false
        type: string
      head:
        description: Approved child PR head SHA
        required: false
        type: string
      base:
        description: Approved current epic branch SHA
        required: false
        type: string
concurrency:
  group: lighthouse-issue-${{ inputs.issue }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  checks: read
  statuses: read
jobs:
  reconcile:
    timeout-minutes: 20
    if: vars.LIGHTHOUSE_AUTOMATION_ENABLED == 'true' && vars.LIGHTHOUSE_EPIC_ENABLED == 'true' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    env:
      LIGHTHOUSE_ISSUE: ${{ inputs.issue }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: juangcarmona/lighthouse
          ref: 9851570cd2fbb403949e2f5cd5746baffb22392e
          path: .lighthouse-harness
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the pinned harness
        working-directory: .lighthouse-harness
        run: npm ci --ignore-scripts
      - name: Reconcile native child issues
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_CI_APP_CLIENT_ID: ${{ vars.LIGHTHOUSE_CI_APP_CLIENT_ID }}
          LIGHTHOUSE_CI_APP_PRIVATE_KEY: ${{ secrets.LIGHTHOUSE_CI_APP_PRIVATE_KEY }}
        run: node .lighthouse-harness/src/packages/sdlc/src/epic-native.mjs
      - name: Preserve the epic journal
        if: always() && inputs.action != 'accept-aggregate'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-epic-journal-${{ inputs.issue }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lighthouse-epic-${{ github.run_id }}-${{ inputs.issue }}/journal.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve child refinement authorization
        if: success() && inputs.action == 'refine-child'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-epic-refinement-${{ inputs.issue }}-${{ inputs.child }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lighthouse-epic-${{ github.run_id }}-${{ inputs.issue }}/refinement.json
          if-no-files-found: error
          retention-days: 14
