name: Lighthouse .NET verification

on:
  pull_request:
    paths:
      - "src/dotnet/**"
      - "src/packages/cli/internal/create-dotnet.mjs"
      - "src/packages/cli/internal/verify-dotnet.mjs"
      - "src/packages/cli/src/lighthouse.mjs"
      - "src/packages/cli/assets/schemas/**"
      - "scripts/verify-adoption.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dotnet.yml"
  push:
    branches: [main]
    paths:
      - "src/dotnet/**"
      - "src/packages/cli/internal/create-dotnet.mjs"
      - "src/packages/cli/internal/verify-dotnet.mjs"
      - "src/packages/cli/src/lighthouse.mjs"
      - "src/packages/cli/assets/schemas/**"
      - "scripts/verify-adoption.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dotnet.yml"

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: src/dotnet/global.json
      - run: npm run verify:dotnet
      - run: npm run verify:adoption
