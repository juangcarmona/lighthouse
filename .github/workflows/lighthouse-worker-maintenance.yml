name: Lighthouse worker maintenance
run-name: '#143 report acceptance · ${{ inputs.mode }}'
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [failure, success, report, observe]
      runs:
        description: Five native run IDs, in fixture order
        type: string
permissions:
  contents: read
jobs:
  fault:
    if: inputs.mode == 'failure' || inputs.mode == 'success'
    name: agent
    runs-on: ubuntu-24.04
    steps:
      - name: Controlled pre-engine outcome
        env:
          MODE: ${{ inputs.mode }}
        run: test "$MODE" = success
  diagnostic:
    if: inputs.mode == 'report'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/143-report-qualification.mjs
        env:
          MODE: diagnostic
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostic
          path: qualification
  report:
    needs: diagnostic
    if: inputs.mode == 'report'
    runs-on: ubuntu-24.04
    concurrency:
      group: lighthouse-worker-reports
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: ci-diagnostic
          path: qualification
      - name: Run reporter and diagnostic regressions on the qualified runtime
        run: node --test src/tests/worker-reports.test.mjs src/tests/delivery-events.test.mjs src/tests/publication-recovery.test.mjs src/tests/worker-recovery.test.mjs
      - run: node scripts/143-report-qualification.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_RUNS: ${{ inputs.runs }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-lifecycle
          path: qualification
          retention-days: 90
  observe:
    concurrency:
      group: lighthouse-worker-reports
      cancel-in-progress: false
      queue: max
    if: inputs.mode == 'observe'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Observe actual existing recovery chains without admitting or dispatching work
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_MAINTENANCE_ENABLED: 'true'
          LIGHTHOUSE_RECOVERY_ENABLED: 'false'
          LIGHTHOUSE_MAINTENANCE_ISSUES: '[341,359,362]'
          LIGHTHOUSE_REPORT_INDEX_ISSUE: '366'
          LIGHTHOUSE_OBSERVED_ISSUES: '[341,359,362]'
        run: |
          for issue in 341 359 362; do
            LIGHTHOUSE_ISSUE="$issue" node src/packages/sdlc/src/worker-maintenance.mjs observe
            mkdir -p "$RUNNER_TEMP/worker-observations/lighthouse-observation-$issue"
            cp "$RUNNER_TEMP/lighthouse-maintenance-$GITHUB_RUN_ID-$issue/observations.json" "$RUNNER_TEMP/worker-observations/lighthouse-observation-$issue/observations.json"
          done
          node src/packages/sdlc/src/worker-maintenance.mjs report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-chain-observations
          path: ${{ runner.temp }}/worker-observations
          retention-days: 90
