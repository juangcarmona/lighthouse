name: Lighthouse worker maintenance
on:
  workflow_run:
    workflows: [review]
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      housekeeping:
        description: Inspect repository housekeeping instead of requesting recovery
        required: false
        type: boolean
        default: false
      dry_run:
        description: Retain inspection evidence without tracker or continuation effects
        required: false
        type: boolean
        default: true
      completed_run:
        description: Native review run from the trusted preparation callback
        required: false
        type: string
      issue:
        description: Optional source issue; empty scans open owner issues
        required: false
        type: string
permissions:
  contents: read
env:
  LIGHTHOUSE_MAINTENANCE_ENABLED: ${{ vars.LIGHTHOUSE_MAINTENANCE_ENABLED }}
  LIGHTHOUSE_RECOVERY_ENABLED: ${{ vars.LIGHTHOUSE_RECOVERY_ENABLED }}
  LIGHTHOUSE_MAINTENANCE_ISSUES: ${{ vars.LIGHTHOUSE_MAINTENANCE_ISSUES }}
jobs:
  daily-housekeeping:
    if: github.actor == github.repository_owner && ((github.event_name == 'schedule' && github.event.schedule == '23 3 * * *' && vars.LIGHTHOUSE_AUTOMATION_ENABLED == 'true' && vars.LIGHTHOUSE_MAINTENANCE_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.housekeeping == true && inputs.completed_run == '' && (inputs.dry_run == true || (vars.LIGHTHOUSE_AUTOMATION_ENABLED == 'true' && vars.LIGHTHOUSE_MAINTENANCE_ENABLED == 'true'))))
    concurrency:
      group: lighthouse-worker-reports
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
      pull-requests: read
    env:
      LIGHTHOUSE_REPORT_INDEX_ISSUE: ${{ vars.LIGHTHOUSE_REPORT_INDEX_ISSUE }}
      LIGHTHOUSE_HOUSEKEEPING_REPOSITORY: ${{ vars.LIGHTHOUSE_HOUSEKEEPING_REPOSITORY }}
    steps:
      - name: Select Node for the published harness
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the published Lighthouse harness
        run: npm install --prefix .lighthouse-harness --ignore-scripts --no-audit --no-fund --package-lock=true --save-exact @juangcarmona/lighthouse-sdlc@0.24.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Inspect daily repository coverage and update the existing index
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/worker-maintenance.mjs housekeeping
      - name: Preserve actual daily scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-daily-housekeeping-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-housekeeping.json
          if-no-files-found: error
          retention-days: 14
  scan:
    if: (github.event_name != 'workflow_dispatch' || inputs.housekeeping != true || inputs.completed_run != '') && vars.LIGHTHOUSE_AUTOMATION_ENABLED == 'true' && vars.LIGHTHOUSE_MAINTENANCE_ENABLED == 'true' && (github.actor == github.repository_owner || ((github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.completed_run != '')) && github.actor == 'github-actions[bot]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      issues: ${{ steps.scan.outputs.issues }}
    steps:
      - name: Select Node for the published harness
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the published Lighthouse harness
        run: npm install --prefix .lighthouse-harness --ignore-scripts --no-audit --no-fund --package-lock=true --save-exact @juangcarmona/lighthouse-sdlc@0.24.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/worker-maintenance.mjs scan
      - name: Preserve completion wake
        if: always() && (github.event_name == 'workflow_run' || inputs.completed_run != '')
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-admission-wake-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-wake.json
          if-no-files-found: error
          retention-days: 14
      - name: Observe workflow telemetry
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/telemetry-workflow.mjs
      - name: Preserve workflow telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-telemetry-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gh-aw/telemetry/*.jsonl
            ${{ runner.temp }}/gh-aw/telemetry/????????-????-????-????-????????????.json
            ${{ runner.temp }}/gh-aw/telemetry/export-health.json
          if-no-files-found: ignore
          retention-days: 14
  observe:
    needs: scan
    if: needs.scan.outputs.issues != '[]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        issue: ${{ fromJSON(needs.scan.outputs.issues) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
    env:
      LIGHTHOUSE_ISSUE: ${{ matrix.issue }}
    steps:
      - name: Select Node for the published harness
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the published Lighthouse harness
        run: npm install --prefix .lighthouse-harness --ignore-scripts --no-audit --no-fund --package-lock=true --save-exact @juangcarmona/lighthouse-sdlc@0.24.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Observe workers without changing issue state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/worker-maintenance.mjs observe
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-observation-${{ matrix.issue }}
          path: ${{ runner.temp }}/lighthouse-maintenance-${{ github.run_id }}-${{ matrix.issue }}/observations.json
          retention-days: 14
          if-no-files-found: error
      - name: Observe workflow telemetry
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/telemetry-workflow.mjs
      - name: Preserve workflow telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-telemetry-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gh-aw/telemetry/*.jsonl
            ${{ runner.temp }}/gh-aw/telemetry/????????-????-????-????-????????????.json
            ${{ runner.temp }}/gh-aw/telemetry/export-health.json
          if-no-files-found: ignore
          retention-days: 14
  reconcile:
    needs: scan
    if: needs.scan.outputs.issues != '[]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        issue: ${{ fromJSON(needs.scan.outputs.issues) }}
    concurrency:
      group: lighthouse-issue-${{ matrix.issue }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      checks: read
      issues: write
      pull-requests: write
    env:
      LIGHTHOUSE_ISSUE: ${{ matrix.issue }}
    steps:
      - name: Select Node for the published harness
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the published Lighthouse harness
        run: npm install --prefix .lighthouse-harness --ignore-scripts --no-audit --no-fund --package-lock=true --save-exact @juangcarmona/lighthouse-sdlc@0.24.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Reconcile and record one bounded retry
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_CI_APP_CLIENT_ID: ${{ vars.LIGHTHOUSE_CI_APP_CLIENT_ID }}
          LIGHTHOUSE_CI_APP_PRIVATE_KEY: ${{ secrets.LIGHTHOUSE_CI_APP_PRIVATE_KEY }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/worker-maintenance.mjs prepare
      - name: Preserve request before dispatch
        if: steps.request.outputs.send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.request.outputs.artifact }}
          path: ${{ runner.temp }}/lighthouse-maintenance-${{ github.run_id }}-${{ matrix.issue }}/dispatch.json
          retention-days: 14
          if-no-files-found: error
      - name: Send the recorded retry once
        if: steps.request.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_DISPATCH_COMMENT: ${{ steps.request.outputs.comment }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/worker-maintenance.mjs send
      - name: Preserve verification recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-recovery-effects-${{ matrix.issue }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lighthouse-maintenance-${{ github.run_id }}-${{ matrix.issue }}/ci-recovery.json
            ${{ runner.temp }}/lighthouse-maintenance-${{ github.run_id }}-${{ matrix.issue }}/completion-recovery.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Resume the recovered completion through the router
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/worker-maintenance.mjs signal-completion
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-maintenance-${{ matrix.issue }}
          path: ${{ runner.temp }}/lighthouse-maintenance-${{ github.run_id }}-${{ matrix.issue }}/observations.json
          retention-days: 14
          if-no-files-found: error
      - name: Observe workflow telemetry
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/telemetry-workflow.mjs
      - name: Preserve workflow telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-telemetry-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gh-aw/telemetry/*.jsonl
            ${{ runner.temp }}/gh-aw/telemetry/????????-????-????-????-????????????.json
            ${{ runner.temp }}/gh-aw/telemetry/export-health.json
          if-no-files-found: ignore
          retention-days: 14
  report:
    needs: [scan, reconcile]
    if: always() && needs.scan.result == 'success' && needs.scan.outputs.issues != '[]' && vars.LIGHTHOUSE_REPORT_INDEX_ISSUE != ''
    concurrency:
      group: lighthouse-worker-reports
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      LIGHTHOUSE_REPORT_INDEX_ISSUE: ${{ vars.LIGHTHOUSE_REPORT_INDEX_ISSUE }}
      LIGHTHOUSE_OBSERVED_ISSUES: ${{ needs.scan.outputs.issues }}
    steps:
      - name: Select Node for the published harness
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the published Lighthouse harness
        run: npm install --prefix .lighthouse-harness --ignore-scripts --no-audit --no-fund --package-lock=true --save-exact @juangcarmona/lighthouse-sdlc@0.24.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: lighthouse-maintenance-*
          path: ${{ runner.temp }}/worker-observations
      - name: Reconcile and update worker error reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/worker-maintenance.mjs report
      - name: Observe workflow telemetry
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/telemetry-workflow.mjs
      - name: Preserve workflow telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-telemetry-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gh-aw/telemetry/*.jsonl
            ${{ runner.temp }}/gh-aw/telemetry/????????-????-????-????-????????????.json
            ${{ runner.temp }}/gh-aw/telemetry/export-health.json
          if-no-files-found: ignore
          retention-days: 14
  report-stalled:
    needs: [scan, observe]
    if: always() && needs.scan.result == 'success' && needs.scan.outputs.issues != '[]' && vars.LIGHTHOUSE_REPORT_INDEX_ISSUE != ''
    concurrency:
      group: lighthouse-worker-reports
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      LIGHTHOUSE_REPORT_INDEX_ISSUE: ${{ vars.LIGHTHOUSE_REPORT_INDEX_ISSUE }}
      LIGHTHOUSE_OBSERVED_ISSUES: ${{ needs.scan.outputs.issues }}
    steps:
      - name: Select Node for the published harness
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the published Lighthouse harness
        run: npm install --prefix .lighthouse-harness --ignore-scripts --no-audit --no-fund --package-lock=true --save-exact @juangcarmona/lighthouse-sdlc@0.24.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: lighthouse-observation-*
          path: ${{ runner.temp }}/worker-observations
      - name: Reconcile and update worker error reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/worker-maintenance.mjs report
      - name: Observe workflow telemetry
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .lighthouse-harness/node_modules/@juangcarmona/lighthouse-sdlc/src/telemetry-workflow.mjs
      - name: Preserve workflow telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-telemetry-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gh-aw/telemetry/*.jsonl
            ${{ runner.temp }}/gh-aw/telemetry/????????-????-????-????-????????????.json
            ${{ runner.temp }}/gh-aw/telemetry/export-health.json
          if-no-files-found: ignore
          retention-days: 14
