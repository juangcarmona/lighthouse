name: Public engineering site

on:
  pull_request:
    paths:
      - "src/public-site/**"
      - "src/packages/ui/*.css"
      - "assets/**"
      - "docs/product/**"
      - "docs/architecture/**"
      - "lighthouse.json"
      - ".product/config.yaml"
      - "scripts/build-public-site.mjs"
      - "scripts/capture-public-site.mjs"
      - "scripts/verify-public-site.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/public-site.yml"
  push:
    branches: [main]
    paths:
      - "src/public-site/**"
      - "src/packages/ui/*.css"
      - "assets/**"
      - "docs/product/**"
      - "docs/architecture/**"
      - "lighthouse.json"
      - ".product/config.yaml"
      - "scripts/build-public-site.mjs"
      - "scripts/capture-public-site.mjs"
      - "scripts/verify-public-site.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/public-site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One publisher owns the public engineering site; queue main updates so a deployment cannot be replaced mid-flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('lighthouse-public-site-pr-{0}', github.event.pull_request.number) || 'lighthouse-public-site' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate public engineering site
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chrome for architecture rendering
        run: npx --no-install puppeteer browsers install chrome
      - name: Install Chromium for portal screenshots
        run: npx --no-install playwright install --with-deps chromium
      - name: Build and verify the deployable site
        run: npm run verify:public-site
      - name: Serve the validated site for screenshot capture
        run: |
          nohup python3 -m http.server 4174 --directory dist/public-site > /tmp/lighthouse-public-site.log 2>&1 &
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lighthouse-public-site.log
          exit 1
      - name: Capture portal screenshots
        run: npm run capture:public-site
      - name: Upload portal screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-public-site-screenshots-${{ github.event.pull_request.number || github.run_id }}
          path: test-results/public-site
          if-no-files-found: error
          retention-days: 14
      - name: Upload the validated site for review
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-public-site-${{ github.run_id }}
          path: dist/public-site
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish public engineering site
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chrome for architecture rendering
        run: npx --no-install puppeteer browsers install chrome
      - name: Build the verified site output
        run: npm run build:public-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
