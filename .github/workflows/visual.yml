name: Lighthouse visual verification

on:
  pull_request:
    paths:
      - "src/gallery/**"
      - "src/packages/ui/*.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual.yml"
  push:
    branches: [main]
    paths:
      - "src/gallery/**"
      - "src/packages/ui/*.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual.yml"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14
