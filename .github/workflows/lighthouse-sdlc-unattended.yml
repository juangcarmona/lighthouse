name: unattended
run-name: "#101 independent reviewer qualification"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, linux, lighthouse-workflow]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the source-built package under test
        run: |
          set -euo pipefail
          mkdir -p node_modules/.acceptance-101
          npm pack ./src/packages/sdlc --pack-destination node_modules/.acceptance-101 --json > node_modules/.acceptance-101/pack.json
          mkdir -p "$RUNNER_TEMP/acceptance-101"
          cp node_modules/.acceptance-101/*.tgz node_modules/.acceptance-101/pack.json "$RUNNER_TEMP/acceptance-101/"
          npm install --prefix node_modules/.acceptance-101 node_modules/.acceptance-101/*.tgz --ignore-scripts
          echo "LIGHTHOUSE_ACCEPTANCE_HARNESS=$GITHUB_WORKSPACE/node_modules/.acceptance-101/node_modules/@juangcarmona/lighthouse-sdlc" >> "$GITHUB_ENV"
      - name: Prove actual source tampering detection and read-only review mounts
        run: |
          set -euo pipefail
          export LIGHTHOUSE_TEST_IMAGE=$(node -e 'const c=require(process.env.LIGHTHOUSE_ENGINE_CONFIG);console.log(c.implementationImage)')
          node --test src/tests/verification-integrity.integration.test.mjs src/tests/worker-evidence.integration.test.mjs
      - name: Qualify the actual reviewer against weak and corrected tests
        env:
          LIGHTHOUSE_ACCEPTANCE_ISSUE: '101'
        run: node scripts/acceptance-101-independent-verification.mjs
      - name: Retain original qualification outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-verification-101-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/acceptance-101/*.tgz
            ${{ runner.temp }}/acceptance-101/pack.json
            ${{ runner.temp }}/acceptance-101/**/receipt.json
            ${{ runner.temp }}/acceptance-101/**/report.json
            ${{ runner.temp }}/acceptance-101/**/review-context.json
            ${{ runner.temp }}/acceptance-101/**/request.json
            ${{ runner.temp }}/acceptance-101/**/envelope.json
            ${{ runner.temp }}/acceptance-101/**/runtime.json
            ${{ runner.temp }}/acceptance-101/**/engine-error.json
            ${{ runner.temp }}/acceptance-101/**/evidence/**
            ${{ runner.temp }}/acceptance-101/**/host/**
          retention-days: 30
