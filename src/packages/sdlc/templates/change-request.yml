name: Request a change
description: Tell us what is difficult and what would help.
body:
  - type: textarea
    id: problem
    attributes:
      label: What is difficult today?
      description: Describe the problem and who it affects.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What result would help?
      description: Describe what you would like to be different.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples or context (optional)
      description: Add examples, links or screenshots if useful. No technical plan is needed.
    validations:
      required: false
