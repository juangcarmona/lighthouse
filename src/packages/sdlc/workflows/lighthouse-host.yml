name: Lighthouse external host

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Open issue to triage under the registered supervised policy.
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    if: >-
      github.actor == github.repository_owner &&
      !github.event.issue.pull_request &&
      ((github.event_name == 'issues' && github.event.label.name == 'refine') ||
       github.event_name == 'workflow_dispatch' ||
       github.event.comment.body == '/lh:triage' ||
       startsWith(github.event.comment.body, '/lh:refine '))
    runs-on: [self-hosted, linux, lighthouse-host]
    timeout-minutes: 20
    steps:
      - name: Submit one stage to the registered host
        env:
          LIGHTHOUSE_RECEIPT: ${{ runner.temp }}/lighthouse-${{ github.run_id }}-${{ github.run_attempt }}.json
          LIGHTHOUSE_ISSUE: ${{ inputs.issue }}
          LIGHTHOUSE_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: lighthouse-host-bridge github-event
      - name: Preserve the operational receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-host-${{ github.run_id }}
          path: ${{ runner.temp }}/lighthouse-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 14
      - name: Observe workflow telemetry
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/packages/sdlc/src/telemetry-workflow.mjs
      - name: Preserve workflow telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-telemetry-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gh-aw/telemetry/*.jsonl
            ${{ runner.temp }}/gh-aw/telemetry/????????-????-????-????-????????????.json
            ${{ runner.temp }}/gh-aw/telemetry/export-health.json
          if-no-files-found: ignore
          retention-days: 14
