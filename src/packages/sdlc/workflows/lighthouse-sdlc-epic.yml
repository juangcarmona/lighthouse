# Not installed until child delivery and aggregate publication are connected.
name: Lighthouse epic reconciliation
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Parent issue with an authenticated decomposition plan
        required: true
        type: string
concurrency:
  group: lighthouse-issue-${{ inputs.issue }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: read
jobs:
  reconcile:
    if: vars.LIGHTHOUSE_AUTOMATION_ENABLED == 'true' && vars.LIGHTHOUSE_EPIC_ENABLED == 'true' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    env:
      LIGHTHOUSE_ISSUE: ${{ inputs.issue }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: juangcarmona/lighthouse
          ref: __LIGHTHOUSE_REF__
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the pinned harness
        run: npm ci --ignore-scripts
      - name: Reconcile native child issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/packages/sdlc/src/epic-native.mjs
      - name: Preserve the epic journal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-epic-journal-${{ inputs.issue }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lighthouse-epic-${{ github.run_id }}-${{ inputs.issue }}/journal.json
          if-no-files-found: error
          retention-days: 14
