# Optional GitHub-native refinement adapter; source owned by lighthouse-sdlc.
name: Lighthouse issue router
run-name: "Refine #${{ github.event.issue.number || inputs.issue }} · ${{ github.actor }}"
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Open issue to refine
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: lighthouse-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  route:
    if: >-
      github.actor == github.repository_owner &&
      !github.event.issue.pull_request &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && github.event.label.name == 'refine') ||
       (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'needs-info')))
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.route.outputs.run }}
      issue: ${{ steps.route.outputs.issue }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: juangcarmona/lighthouse
          ref: __LIGHTHOUSE_REF__
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Route the authorized event
        id: route
        run: node src/packages/sdlc/src/issue-actions.mjs route
  refine:
    needs: route
    if: needs.route.outputs.run == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/lighthouse-issue-refine.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
