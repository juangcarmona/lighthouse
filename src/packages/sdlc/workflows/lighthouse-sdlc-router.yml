# Optional GitHub-native stage adapter; source owned by lighthouse-sdlc.
name: Lighthouse SDLC router
run-name: "${{ inputs.stage || github.event.label.name || (github.event_name == 'issue_comment' && 'reply') || 'refine' }} #${{ github.event.issue.number || inputs.issue }} · ${{ github.actor }}"
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Work item to process
        required: true
        type: string
      stage:
        description: Authorized lifecycle stage
        required: true
        default: refine
        type: choice
        options: [refine, propose, implement, integrate, review]
      pull_request:
        description: PR number for integrate or review
        required: false
        type: string
      head:
        description: Full accepted PR head SHA for integrate or review
        required: false
        type: string
      merge:
        description: Explicitly authorize integrating this accepted PR head
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: lighthouse-sdlc-${{ github.repository }}
  cancel-in-progress: false
jobs:
  route:
    if: >-
      vars.LIGHTHOUSE_AUTOMATION_ENABLED == 'true' &&
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && (github.event.label.name == 'refine' || github.event.label.name == 'propose' || github.event.label.name == 'implement')) ||
       github.event_name == 'issue_comment' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      run: ${{ steps.route.outputs.run }}
      issue: ${{ steps.route.outputs.issue }}
      stage: ${{ steps.route.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: juangcarmona/lighthouse
          ref: __LIGHTHOUSE_REF__
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Route the authorized event
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/packages/sdlc/src/issue-actions.mjs route
  refine:
    needs: route
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'refine'
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/lighthouse-sdlc-refine.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
  propose:
    needs: route
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'propose'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/lighthouse-sdlc-propose.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
  implement:
    needs: route
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'implement'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/lighthouse-sdlc-implement.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
  integrate:
    needs: route
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'integrate'
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/lighthouse-sdlc-integrate.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
  review:
    needs: route
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'review'
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/lighthouse-sdlc-review.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
