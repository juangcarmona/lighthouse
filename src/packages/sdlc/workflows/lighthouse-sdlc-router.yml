# Optional GitHub-native stage adapter; source owned by lighthouse-sdlc.
name: Lighthouse SDLC router
run-name: "${{ (github.event_name == 'workflow_run' && 'Delivery after CI') || inputs.stage || github.event.label.name || ((github.event.pull_request || github.event.issue.pull_request) && 'PR review') || (github.event_name == 'issue_comment' && 'reply') || 'refine' }} #${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }} · ${{ github.actor }}"
on:
  issues:
    types: [labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue:
        description: Work item to process
        required: true
        type: string
      stage:
        description: Authorized lifecycle stage
        required: true
        default: refine
        type: choice
        options: [refine, propose, implement, integrate, review]
      pull_request:
        description: PR number for integrate or review
        required: false
        type: string
      head:
        description: Full accepted PR head SHA for integrate or review
        required: false
        type: string
      merge:
        description: Explicitly authorize integrating this accepted PR head
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  route:
    if: >-
      vars.LIGHTHOUSE_AUTOMATION_ENABLED == 'true' &&
      (github.actor == github.repository_owner || github.event_name == 'workflow_run') &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' ||
       (github.event_name == 'issues' && (github.event.label.name == 'refine' || github.event.label.name == 'propose' || github.event.label.name == 'implement' || (github.event.action == 'unlabeled' && github.event.label.name == 'future'))) ||
       github.event_name == 'issue_comment' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    outputs:
      run: ${{ steps.route.outputs.run }}
      issue: ${{ steps.route.outputs.issue }}
      stage: ${{ steps.route.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: juangcarmona/lighthouse
          ref: __LIGHTHOUSE_REF__
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Route the authorized event
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_COMPLETION_ENABLED: true
        run: node src/packages/sdlc/src/issue-actions.mjs route
  refine:
    needs: route
    concurrency:
      group: lighthouse-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'refine'
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/lighthouse-sdlc-refine.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
      auto-implement: true
  propose:
    needs: route
    concurrency:
      group: lighthouse-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'propose'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/lighthouse-sdlc-propose.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
  implement:
    name: Dispatch implementation
    needs: [route, refine]
    concurrency:
      group: lighthouse-dispatch-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
      queue: max
    if: always() && needs.route.result == 'success' && needs.route.outputs.run == 'true' && (needs.route.outputs.stage == 'implement' || needs.refine.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    env:
      LIGHTHOUSE_ISSUE: ${{ needs.route.outputs.issue }}
      LIGHTHOUSE_IMPLEMENT_HANDOFF: ${{ needs.route.outputs.stage == 'refine' }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: juangcarmona/lighthouse
          ref: __LIGHTHOUSE_REF__
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Load refinement request
        if: needs.route.outputs.stage == 'refine'
        uses: actions/download-artifact@v8
        with:
          name: lighthouse-input-${{ needs.route.outputs.issue }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/refinement-handoff
      - name: Load refinement result
        if: needs.route.outputs.stage == 'refine'
        uses: actions/download-artifact@v8
        with:
          name: lighthouse-result-${{ needs.route.outputs.issue }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/refinement-handoff
      - name: Record the authorized request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/packages/sdlc/src/issue-actions.mjs dispatch-prepare
      - name: Preserve the request before dispatch
        if: steps.request.outputs.send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.request.outputs.artifact }}
          path: ${{ runner.temp }}/lighthouse-${{ github.run_id }}-${{ github.run_attempt }}/dispatch.json
          retention-days: 14
          if-no-files-found: error
      - name: Dispatch the independent implementation
        if: steps.request.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_DISPATCH_COMMENT: ${{ steps.request.outputs.comment }}
        run: node src/packages/sdlc/src/issue-actions.mjs dispatch-send
  integrate:
    needs: route
    concurrency:
      group: lighthouse-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'integrate'
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/lighthouse-sdlc-integrate.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
  review:
    needs: route
    concurrency:
      group: lighthouse-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    if: needs.route.outputs.run == 'true' && needs.route.outputs.stage == 'review'
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/lighthouse-sdlc-review.lock.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
